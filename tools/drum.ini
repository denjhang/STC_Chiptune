# drum.ini - ADPCM 鼓组变频映射 + 快捷键
# Python 端变频: step = base_step * ratio, 通过 0x27/0x2D 写入
# 鼓变频无上限(无循环, ISR无压力)
# SF2旋律变频上限 0x0400 (有循环, C5以上死机)
#
# 鼓硬件 (drum_id):
#   0 = BD  Bass Drum    base_step=0x0100
#   1 = SD  Snare        base_step=0x0100
#   2 = CY  Cymbal       base_step=0x0080
#   3 = HH  Hi-Hat       base_step=0x0100
#   4 = TM  Tom          base_step=0x0080
#   5 = RS  Rimshot      base_step=0x0080
#
# ratio = 2^(semitones/12), 1.0=原音, <1.0=降音, >1.0=升音

# ============================================================
# [map] MIDI GM Percussion Key Map (35-81)
# 格式: midi_note = name | drum_id | ratio | 注释
# ============================================================
[map]
# ===== 底鼓 Bass Drum (35-36) =====
35 = Acoustic Bass Drum  | 0 | 0.85  | 原声底鼓, 稍低沉
36 = Bass Drum 1         | 0 | 1.00  | 标准底鼓

# ===== 边击/拍手 (37-40) =====
37 = Side Stick           | 5 | 0.80  | 鼓边击, Rimshot降频
38 = Acoustic Snare        | 1 | 1.00  | 标准军鼓
39 = Hand Clap             | 1 | 1.26  | 拍手, SD升半倍音
40 = Electric Snare        | 1 | 1.20  | 电子军鼓, SD略升频

# ===== 落地嗵 Floor Tom (41, 43) =====
41 = Low Floor Tom         | 4 | 0.70  | 低落地嗵, Tom大幅降频
43 = High Floor Tom         | 4 | 0.85  | 高落地嗵, Tom降频

# ===== 踩镲 Hi-Hat (42, 44, 46) =====
42 = Closed Hi-Hat          | 3 | 1.00  | 闭镲, HH降频紧凑
44 = Pedal Hi-Hat           | 3 | 1.30  | 踏板镲, HH大幅降频
46 = Open Hi-Hat            | 3 | 0.70  | 开镲, HH升频松散

# ===== 嗵鼓 Tom (45, 47-48, 50) =====
45 = Low Tom                | 4 | 0.85  | 低嗵, Tom降频
47 = Low-Mid Tom            | 4 | 1.00  | 中低嗵, Tom标准
48 = Hi-Mid Tom             | 4 | 1.20  | 中高嗵, Tom升频
50 = High Tom               | 4 | 1.40  | 高嗵, Tom升频

# ===== 镲片 Cymbal (49, 51-53, 55, 57, 59) =====
49 = Crash Cymbal 1         | 2 | 0.90  | 强音镲, CY略降频
51 = Ride Cymbal 1          | 2 | 1.00  | 节奏镲, CY标准
52 = Chinese Cymbal         | 2 | 1.20  | 中国镲, CY升频
53 = Ride Bell              | 2 | 1.50  | 节奏镲钟, CY大幅升频
55 = Splash Cymbal          | 2 | 1.80  | 飞溅镲, CY高频
57 = Crash Cymbal 2         | 2 | 0.80  | 强音镲2, CY降频
59 = Ride Cymbal 2          | 2 | 1.10  | 节奏镲2, CY略升

# ===== 铃/棒/板 (54, 56, 58) =====
54 = Tambourine             | 5 | 1.50  | 铃鼓, RS升频清脆
56 = Cowbell                 | 5 | 1.20  | 牛铃, RS升频
58 = Vibraslap              | 5 | 0.70  | 震音击板, RS降频

# ===== 邦戈/康加 (60-64) =====
60 = Hi Bongo               | 4 | 1.60  | 高音邦戈, Tom高升频
61 = Low Bongo              | 4 | 1.30  | 低音邦戈, Tom升频
62 = Mute Hi Conga          | 4 | 1.20  | 静音高康加, Tom升频
63 = Open Hi Conga          | 4 | 1.40  | 开音高康加, Tom高升频
64 = Low Conga              | 4 | 0.70  | 低康加, Tom降频

# ===== 蒂姆巴尔/阿果果 (65-68) =====
65 = High Timbale           | 4 | 1.80  | 高蒂姆巴尔, Tom最高
66 = Low Timbale            | 4 | 1.40  | 低蒂姆巴尔, Tom升频
67 = High Agogo             | 5 | 1.60  | 高阿果果, RS高升频
68 = Low Agogo              | 5 | 1.30  | 低阿果果, RS升频

# ===== 小型打击乐 (69-81) =====
69 = Cabasa                 | 5 | 1.10  | 卡巴萨, RS略升频
70 = Maracas                | 5 | 1.20  | 沙锤, RS升频
71 = Short Whistle          | 0 | 2.00  | 短哨, BD高升频(泛音)
72 = Long Whistle           | 0 | 1.60  | 长哨, BD升频
73 = Short Guiro            | 5 | 0.60  | 短刮鱼, RS大幅降频
74 = Long Guiro             | 5 | 0.80  | 长刮鱼, RS降频
75 = Claves                 | 5 | 1.80  | 响棒, RS高升频硬击
76 = Hi Wood Block           | 5 | 1.40  | 高木鱼, RS升频
77 = Low Wood Block          | 5 | 1.10  | 低木鱼, RS略升频
78 = Mute Cuica             | 4 | 1.60  | 静音奎卡, Tom高升频
79 = Open Cuica             | 4 | 2.00  | 开音奎卡, Tom最高
80 = Mute Triangle           | 2 | 2.00  | 静音三角铁, CY最高
81 = Open Triangle           | 2 | 2.50  | 开三角铁, CY极高

# ============================================================
# [aliases] 快捷键 = MIDI note number
# 用于节奏模式中缩写, 随意增删改
# ============================================================
[aliases]
# 底鼓
K = 36
# 军鼓
S = 38
SC = 39
SE = 40
# 踩镲
HC = 42
HP = 44
HO = 46
# 嗵鼓
TL = 41
TM = 43
T2 = 45
T3 = 47
T4 = 48
TH = 50
# 镲片 (少用)
CR = 49
RD = 51
SP = 55
# Rimshot
R = 37
RB = 54
RC = 56

# ============================================================
# [volume] 鼓硬件音量 (0-31), 全局默认
# 风格ini可用 vol_bd 等覆盖
# ============================================================
[volume]
vol_bd = 16
vol_sd = 24
vol_cy = 20
vol_hh = 6
vol_tm = 24
vol_rs = 20
