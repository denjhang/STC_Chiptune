[env:stc8h8k64u]
platform = intel_mcs51
board = STC8H8K64U
build_flags =
    -D__CONF_MCU_MODEL=0x32
    -D__CONF_FOSC=11059200UL
lib_deps = FwLib_STC8
upload_protocol = custom
upload_port = COM3
upload_speed = 115200
upload_flags =
    -p
    $UPLOAD_PORT
    -s
    115200
    -e
upload_command = ${platformio.packages_dir}/tool-stc8prog/stc8prog.exe $UPLOAD_FLAGS -f $SOURCE
